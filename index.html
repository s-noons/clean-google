<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Clean Google</title>
</head>

<body>
  <h1>Clean Google</h1>

  <form action="https://www.google.com/search" method="get">
    <input type="text" name="q" placeholder="Search Google">
    <input type="hidden" name="filter"
      value="-site:reddit.com -site:youtube.com -site:facebook.com -site:instagram.com -site:tiktok.com -site:x.com -site:twitter.com -site:snapchat.com -site:twitch.tv -site:netflix.com -site:threads.net">
    <button type="submit">Search</button>
  </form>

  <script>
    document.querySelector("form").addEventListener("submit", function(e) {
      e.preventDefault();

      const query = document.querySelector('[name="q"]').value;
      const exclusions =
        "-site:reddit.com -site:youtube.com -site:facebook.com " +
        "-site:instagram.com -site:tiktok.com -site:x.com " +
        "-site:twitter.com -site:snapchat.com -site:twitch.tv " +
        "-site:netflix.com -site:threads.net";

      window.location.href =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query + " " + exclusions);
    });
  </script>
</body>
</html>
