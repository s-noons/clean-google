<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Clean Google</title>

  <!-- Tell Chrome that this site provides a search engine -->
  <link
    rel="search"
    type="application/opensearchdescription+xml"
    title="Clean Google"
    href="https://s-noons.github.io/clean-google/opensearch.xml"
  >
</head>
 
<body>

  <h1>Clean Google</h1>

  <form id="searchForm">
    <input
      id="searchBox"
      type="search"
      placeholder="Search Google"
      autocomplete="off"
      autofocus
    >
    <button type="submit">Search</button>
  </form>

  <script>

    /*
    ============================================================
    BLOCKLIST

    To add another website later, simply add:
    "example.com",

    Don't include https:// or www.
    ============================================================
    */

    const blockedSites = [

      // SOCIAL / COMMUNITY
      "reddit.com",
      "facebook.com",
      "instagram.com",
      "threads.net",
      "tiktok.com",
      "x.com",
      "twitter.com",
      "snapchat.com",
      "bereal.com",
      "tumblr.com",

      // PHOTOGRAPHY / IMAGE / DISCOVERY
      "flickr.com",
      "pinterest.com",
      "imgur.com",

      // PUBLISHING / FEEDS
      "substack.com",

      // VIDEO
      "youtube.com",
      "vimeo.com",
      "dailymotion.com",
      "twitch.tv",

      // STREAMING
      "netflix.com",
      "primevideo.com",
      "disneyplus.com"

    ];


    /*
    ============================================================
    SEARCH CODE — DON'T EDIT BELOW HERE
    ============================================================
    */

    const searchForm = document.getElementById("searchForm");
    const searchBox = document.getElementById("searchBox");

    searchForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const query = searchBox.value.trim();

      if (!query) return;

      const exclusions = blockedSites
        .map(site => "-site:" + site)
        .join(" ");

      const cleanQuery = query + " " + exclusions;

      window.location.href =
        "https://www.google.com/search?q=" +
        encodeURIComponent(cleanQuery);

    });

  </script>

</body>

</html>
